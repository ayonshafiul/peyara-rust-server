[package]
name = "peyara-egui"
version = "2.0.0"
description = "Peyara Remote Mouse Server (Rust + egui): wireless touchpad, keyboard and clipboard sharing from mobile devices"
authors = ["Shafiul Muslebeen"]
edition = "2021"
license = "ISC"
rust-version = "1.85"

[[bin]]
name = "peyara-egui"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Shafiul Muslebeen"
copyright = "2026, Shafiul Muslebeen"
license-file = []
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/peyara-egui", "usr/bin/", "755"],
  ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/peyara-egui.png", "644"],
  ["assets/peyara-egui.desktop", "usr/share/applications/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/peyara-egui", dest = "/usr/bin/peyara-egui", mode = "755" },
  { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/peyara-egui.png", mode = "644" },
  { source = "assets/peyara-egui.desktop", dest = "/usr/share/applications/peyara-egui.desktop", mode = "644" },
]

[dependencies]
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync", "io-util"] }
axum = "0.8"
socketioxide = { version = "0.18", features = ["v4", "state", "extensions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = { version = "0.6", features = ["libei_tokio"] }
arboard = "3"
qrcode = "0.14"
image = "0.25"
if-addrs = "0.15"
hostname = "0.4"
